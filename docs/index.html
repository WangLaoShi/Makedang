<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Makedang Markdown 编辑器</title>
  <meta name="description" content="免费在线 Markdown 编辑器，支持实时预览、代码高亮、数学公式、Mermaid 图表，数据保存在浏览器本地。">
  <meta name="keywords" content="Markdown编辑器,在线Markdown,Makedang,实时预览">
  <meta name="robots" content="index, follow">
  <link rel="icon" href="favicon.ico">
  <script>
    (function() {
      var saved = localStorage.getItem('md_editor_theme');
      if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>

  <!-- Open Graph -->
  <meta property="og:title" content="Makedang Markdown 编辑器">
  <meta property="og:description" content="免费在线 Markdown 编辑器，支持实时预览、代码高亮、数学公式、Mermaid 图表。">
  <meta property="og:url" content="https://makedang.com/">
  <meta property="og:type" content="website">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Makedang Markdown 编辑器">
  <meta name="twitter:description" content="免费在线 Markdown 编辑器，支持实时预览、代码高亮、数学公式、Mermaid 图表。">

  <!-- JSON-LD 结构化数据 -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "Makedang Markdown 编辑器",
    "description": "免费在线 Markdown 编辑器，支持实时预览、代码高亮、数学公式、Mermaid 图表。",
    "url": "https://makedang.com/",
    "applicationCategory": "DeveloperApplication",
    "operatingSystem": "Any",
    "offers": {
      "@type": "Offer",
      "price": "0",
      "priceCurrency": "CNY"
    }
  }

  <!-- KaTeX -->
  <link rel="stylesheet" href="vendor/katex/katex.min.css">
  <script src="vendor/katex/katex.min.js" defer></script>
  <script src="vendor/katex/auto-render.min.js" defer></script>

  <!-- Highlight.js -->
  <link rel="stylesheet" href="vendor/highlight.js/github.min.css" id="hljs-theme">
  <script src="vendor/highlight.js/highlight.min.js" defer></script>

  <!-- Marked -->
  <script src="vendor/marked/marked.min.js" defer></script>

  <!-- DOMPurify -->
  <script src="vendor/dompurify/purify.min.js" defer></script>

  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <style>
    #page-loader {
      position: fixed; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #f5f5f5; z-index: 9999; transition: opacity 0.3s ease;
    }
    #page-loader.hidden { opacity: 0; pointer-events: none; }
    #page-loader .page-loader-spinner {
      width: 40px; height: 40px;
      border: 4px solid #e0e0e0; border-top-color: #2563eb; border-radius: 50%;
      animation: page-loader-spin 0.8s linear infinite;
    }
    @keyframes page-loader-spin { to { transform: rotate(360deg); } }
    #page-loader .page-loader-text { margin-top: 12px; font-size: 14px; color: #666; }
    html[data-theme="dark"] #page-loader { background: #1a1a2e; }
    html[data-theme="dark"] #page-loader .page-loader-spinner { border-color: #2a2a4a; border-top-color: #4cc9f0; }
    html[data-theme="dark"] #page-loader .page-loader-text { color: #b0b0b0; }
  </style>
  <div id="page-loader" class="page-loader">
    <div class="page-loader-spinner"></div>
    <div class="page-loader-text">加载中...</div>
  </div>
  <div class="app">
    <!-- 顶部工具栏 -->
    <header class="toolbar">
      <div class="toolbar-left">
        <a href="https://makedang.com/" class="logo" title="返回首页">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
            <polyline points="10 9 9 9 8 9"></polyline>
          </svg>
          <span>makedang.com</span>
        </a>
        <button class="tool-btn" data-action="toggle-sidebar" title="文件列表">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 7v10a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-6l-2-2H5a2 2 0 0 0-2 2z"></path></svg>
        </button>
        <div class="toolbar-divider"></div>
        <button class="tool-btn" data-action="bold" title="粗体 (Ctrl+B)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 4h8a4 4 0 0 1 4 4 4 4 0 0 1-4 4H6z"></path><path d="M6 12h9a4 4 0 0 1 4 4 4 4 0 0 1-4 4H6z"></path></svg>
        </button>
        <button class="tool-btn" data-action="italic" title="斜体 (Ctrl+I)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="19" y1="4" x2="10" y2="4"></line><line x1="14" y1="20" x2="5" y2="20"></line><line x1="15" y1="4" x2="9" y2="20"></line></svg>
        </button>
        <button class="tool-btn" data-action="underline" title="下划线 (Ctrl+U)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 3v7a6 6 0 0 0 6 6 6 6 0 0 0 6-6V3"></path><line x1="4" y1="21" x2="20" y2="21"></line></svg>
        </button>
        <button class="tool-btn" data-action="strikethrough" title="删除线">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M16 4H9a3 3 0 0 0-2.83 4"></path><path d="M14 12a4 4 0 0 1 0 8H6"></path><line x1="4" x2="20" y1="12" y2="12"></line></svg>
        </button>
        <div class="tool-dropdown">
          <button class="tool-btn" title="标题">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 12h12"></path><path d="M6 20V4"></path><path d="M18 20V4"></path></svg>

          </button>
          <div class="tool-dropdown-menu">
            <button class="tool-dropdown-item" data-action="heading-1">H1 一级标题</button>
            <button class="tool-dropdown-item" data-action="heading-2">H2 二级标题</button>
            <button class="tool-dropdown-item" data-action="heading-3">H3 三级标题</button>
            <button class="tool-dropdown-item" data-action="heading-4">H4 四级标题</button>
            <button class="tool-dropdown-item" data-action="heading-5">H5 五级标题</button>
            <button class="tool-dropdown-item" data-action="heading-6">H6 六级标题</button>
          </div>
        </div>
        <button class="tool-btn" data-action="sup" title="上标">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m4 19 8-8"></path><path d="m12 19-8-8"></path><path d="M20 12h-4c0-1.5.442-2 1.5-2.5S20 8.334 20 7.002c0-.472-.17-.93-.484-1.29a2.105 2.105 0 0 0-2.617-.436c-.42.239-.738.614-.899 1.06"></path></svg>
        </button>
        <button class="tool-btn" data-action="sub" title="下标">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m4 5 8 8"></path><path d="m12 5-8 8"></path><path d="M20 19h-4c0-1.5.44-2 1.5-2.5S20 15.33 20 14c0-.47-.17-.93-.48-1.29a2.11 2.11 0 0 0-2.62-.44c-.42.24-.74.62-.9 1.07"></path></svg>
        </button>
        <button class="tool-btn" data-action="quote" title="引用">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 21c3 0 7-1 7-8V5c0-1.25-.756-2.017-2-2H4c-1.25 0-2 .75-2 1.972V11c0 1.25.75 2 2 2 1 0 1 0 1 1v1c0 1-1 2-2 2s-1 .008-1 1.031V21M15 21c3 0 7-1 7-8V5c0-1.25-.757-2.017-2-2h-4c-1.25 0-2 .75-2 1.972V11c0 1.25.75 2 2 2h.75c0 2.25.25 4-2.75 4v3"></path></svg>
        </button>
        <button class="tool-btn" data-action="code" title="代码块">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg>
        </button>
        <button class="tool-btn" data-action="link" title="链接">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>
        </button>
        <button class="tool-btn" data-action="image" title="图片">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
        </button>
        <button class="tool-btn" data-action="table" title="表格">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="3" y1="15" x2="21" y2="15"></line><line x1="12" y1="3" x2="12" y2="21"></line></svg>
        </button>
        <button class="tool-btn" data-action="list" title="无序列表">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="3.5" cy="5" r="1.5"></circle><circle cx="3.5" cy="12" r="1.5"></circle><circle cx="3.5" cy="19" r="1.5"></circle><path d="M8 5h13"></path><path d="M8 12h13"></path><path d="M8 19h13"></path></svg>
        </button>
        <button class="tool-btn" data-action="ordered-list" title="有序列表">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M11 5h10"></path><path d="M11 12h10"></path><path d="M11 19h10"></path><path d="M4 4h1v5"></path><path d="M4 9h2"></path><path d="M6.5 20H3.4c0-1 2.6-1.925 2.6-3.5a1.5 1.5 0 0 0-2.6-1.02"></path></svg>
        </button>
        <button class="tool-btn" data-action="task-list" title="任务列表">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M13 5h8"></path><path d="M13 12h8"></path><path d="M13 19h8"></path><path d="m3 17 2 2 4-4"></path><rect x="3" y="4" width="6" height="6" rx="1"></rect></svg>
        </button>
        <button class="tool-btn" data-action="hr" title="分割线">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        </button>
        <button class="tool-btn" data-action="toc" title="目录 [TOC]">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="4" y1="6" x2="9" y2="6"></line><line x1="4" y1="12" x2="9" y2="12"></line><line x1="4" y1="18" x2="9" y2="18"></line><line x1="15" y1="6" x2="20" y2="6"></line><line x1="15" y1="12" x2="20" y2="12"></line><line x1="15" y1="18" x2="20" y2="18"></line></svg>
        </button>
      </div>
      <div class="toolbar-right">
        <button class="tool-btn" data-action="import-md" title="导入 Markdown">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
        </button>
        <input type="file" id="import-file" accept=".md,.markdown,.txt,text/markdown,text/plain" style="display:none">
        <button class="tool-btn" data-action="theme" title="切换主题">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
        </button>
        <button class="tool-btn" data-action="line-numbers" title="显示行号" id="line-numbers-toggle">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="4" y1="6" x2="4" y2="6.01"></line><line x1="8" y1="6" x2="20" y2="6"></line><line x1="4" y1="12" x2="4" y2="12.01"></line><line x1="8" y1="12" x2="20" y2="12"></line><line x1="4" y1="18" x2="4" y2="18.01"></line><line x1="8" y1="18" x2="20" y2="18"></line></svg>
        </button>
        <button class="tool-btn" data-action="preview-only" title="仅预览" id="preview-toggle">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="9" y1="21" x2="9" y2="9"></line></svg>
        </button>
        <button class="tool-btn" data-action="download-md" title="下载 Markdown">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
        </button>
        <button class="tool-btn" data-action="download-html" title="下载 HTML">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="4 17 10 11 4 5"></polyline><line x1="12" y1="19" x2="20" y2="19"></line></svg>
        </button>
        <button class="tool-btn" data-action="clear" title="清空">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
        </button>
        <button class="tool-btn" data-action="help" title="快捷键帮助">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"></circle><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
        </button>
      </div>
    </header>

    <!-- 文件侧边栏 -->
    <aside class="file-sidebar" id="file-sidebar">
      <div class="sidebar-header">
        <span>文件</span>
        <button class="sidebar-close" id="sidebar-close" title="关闭">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>
      <div class="file-list" id="file-list"></div>
      <div class="sidebar-footer">
        <button class="sidebar-new-btn" id="sidebar-new-btn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          新建文件
        </button>
      </div>
    </aside>

    <!-- 主体区域 -->
    <main class="editor-container">
      <div class="pane editor-pane">
        <div class="editor-wrapper">
          <div class="line-numbers" id="line-numbers"></div>
          <textarea id="editor" placeholder="在此输入 Markdown..." spellcheck="false"></textarea>
        </div>
        <div class="pane-label">Markdown</div>
      </div>
      <div class="resizer" id="resizer"></div>
      <div class="pane preview-pane">
        <div id="preview" class="preview-content"></div>
        <div class="pane-label">预览</div>
      </div>
    </main>

    <!-- 状态栏 -->
    <footer class="status-bar">
      <div class="status-left">
        <span id="save-status">已保存</span>
        <span class="status-sep">|</span>
        <span id="word-count">0 字</span>
        <span class="status-sep">|</span>
        <span id="cursor-pos">行 1, 列 1</span>
      </div>
      <div class="status-right">
        <label class="sync-scroll-label">
          <input type="checkbox" id="sync-scroll-check" checked>
          <span>同步滚动</span>
        </label>
      </div>
    </footer>
  </div>

  <!-- 全局 Tooltip -->
  <div class="tooltip" id="tooltip"></div>

  <!-- 帮助弹窗 -->
  <div class="modal-overlay" id="help-modal">
    <div class="modal">
      <div class="modal-header">
        <h3>快捷键</h3>
        <button class="modal-close" data-close="help-modal">&times;</button>
      </div>
      <div class="modal-body">
        <table class="shortcut-table">
          <tr><td><kbd>Ctrl</kbd>+<kbd>B</kbd></td><td>粗体</td></tr>
          <tr><td><kbd>Ctrl</kbd>+<kbd>I</kbd></td><td>斜体</td></tr>
          <tr><td><kbd>Ctrl</kbd>+<kbd>K</kbd></td><td>链接</td></tr>
          <tr><td><kbd>Ctrl</kbd>+<kbd>S</kbd></td><td>手动保存</td></tr>
          <tr><td><kbd>Ctrl</kbd>+<kbd>/</kbd></td><td>注释</td></tr>
          <tr><td><kbd>Ctrl</kbd>+<kbd>Z</kbd></td><td>撤销</td></tr>
          <tr><td><kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>Z</kbd></td><td>重做</td></tr>
          <tr><td><kbd>Tab</kbd></td><td>缩进</td></tr>
          <tr><td><kbd>Shift</kbd>+<kbd>Tab</kbd></td><td>取消缩进</td></tr>
        </table>
      </div>
    </div>
  </div>

  <!-- 图片预览 -->
  <div class="img-preview-overlay" id="img-preview">
    <img src="" alt="预览" id="img-preview-img">
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
